server:
  port: 8080

spring:
  application:
    name: quiz
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true

jwt:
  secret: ${JWT_SERVICE}

# --- LOGGING CONFIGURATION ---
logging:
  file:
    name: logs/quiz-app.log
  level:
    root: INFO
    com.nibin.quiz: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE