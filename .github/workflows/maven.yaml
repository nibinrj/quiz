name: Java CI with Maven

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:

  DOCKER_REPOSITORY: nibinrj/quiz

jobs:
  # Unit tests (surefire) plus the Testcontainers integration tests (failsafe).
  # GitHub's ubuntu runners ship a working Docker daemon, which is all the ITs need.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Verify (unit + integration tests)
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: test
    # Only publish from master, and never from a fork's pull request, where the
    # Docker Hub secrets are not available.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, tag, and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ env.DOCKER_REPOSITORY }}:$IMAGE_TAG -t ${{ env.DOCKER_REPOSITORY }}:latest .
          docker push ${{ env.DOCKER_REPOSITORY }}:$IMAGE_TAG
          docker push ${{ env.DOCKER_REPOSITORY }}:latest
